[workspace]
resolver = "2"
members = [".", "rlint-node"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
apollo-parser = "0.8.7"
clap = { version = "4.6.7", features = ["derive"] }
oxc_allocator = "0.152.0"
oxc_parser = "0.152.0"
oxc_span = "0.152.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tsrs_api = { git = "https://github.com/oxc-project/tsrs", rev = "c21a36ef2dd2c8ec8fdfcc8ac32fd98cd5bd8ef5" }
tsrs_api_transport = { git = "https://github.com/oxc-project/tsrs", rev = "c21a36ef2dd2c8ec8fdfcc8ac32fd98cd5bd8ef5" }
tsrs_core = { git = "https://github.com/oxc-project/tsrs", rev = "c21a36ef2dd2c8ec8fdfcc8ac32fd98cd5bd8ef5" }
tsrs_ast = { git = "https://github.com/oxc-project/tsrs", rev = "c21a36ef2dd2c8ec8fdfcc8ac32fd98cd5bd8ef5" }
tsrs_tsoptions = { git = "https://github.com/oxc-project/tsrs", rev = "c21a36ef2dd2c8ec8fdfcc8ac32fd98cd5bd8ef5" }
tsrs_checker = { git = "https://github.com/oxc-project/tsrs", rev = "c21a36ef2dd2c8ec8fdfcc8ac32fd98cd5bd8ef5" }
tsrs_scanner = { git = "https://github.com/oxc-project/tsrs", rev = "c21a36ef2dd2c8ec8fdfcc8ac32fd98cd5bd8ef5" }
tsrs_compiler = { git = "https://github.com/oxc-project/tsrs", rev = "c21a36ef2dd2c8ec8fdfcc8ac32fd98cd5bd8ef5" }
tsrs_vfs = { git = "https://github.com/oxc-project/tsrs", rev = "c21a36ef2dd2c8ec8fdfcc8ac32fd98cd5bd8ef5" }

[package]
name = "rlint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Run ESLint-compatible rules with Rust parsing and native TypeScript type services"
license = "MIT"
repository = "https://github.com/gabrielcsapo/rlint"
homepage = "https://github.com/gabrielcsapo/rlint"
readme = "README.md"
keywords = ["eslint", "lint", "typescript", "oxc", "linter"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "rlint"
crate-type = ["rlib", "dylib"]

[features]
in-process-node = []
typed-native = ["in-process-node"]

[[bin]]
name = "rlint"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
apollo-parser.workspace = true
clap.workspace = true
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tsrs_api.workspace = true
tsrs_api_transport.workspace = true
tsrs_ast.workspace = true
tsrs_checker.workspace = true
tsrs_compiler.workspace = true
tsrs_core.workspace = true
tsrs_scanner.workspace = true
tsrs_tsoptions.workspace = true
tsrs_vfs.workspace = true

[dev-dependencies]
tempfile.workspace = true
