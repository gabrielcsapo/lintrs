name: release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]

jobs:
  dist:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo fetch --locked
      - name: Build the native layout
        run: node scripts/build-native.mjs --build /tmp/rlint-native-build --out "$PWD/target/rlint-native"
      - name: Build the distribution
        run: npm run dist -- --build /tmp/rlint-native-build
      - name: Smoke the distribution
        run: |
          dir=$(node -p 'const fs=require("fs");JSON.parse(fs.readFileSync("dist/"+fs.readdirSync("dist").find(f=>f.endsWith(".json")),"utf8")).directory')
          mv "$dir" "$RUNNER_TEMP/rlint-moved"
          sdk=$(node -p 'const fs=require("fs");JSON.parse(fs.readFileSync("dist/"+fs.readdirSync("dist").find(f=>f.endsWith(".json")),"utf8")).sdkTarball')
          node scripts/smoke-dist.mjs "$RUNNER_TEMP/rlint-moved" "$sdk"
      - uses: actions/upload-artifact@v4
        with:
          name: rlint-${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rlint-*
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" --title "rlint ${{ github.ref_name }}" --generate-notes ./*.tar.gz
