name: release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]

jobs:
  dist:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo fetch --locked
      - name: Build the native layout
        run: node scripts/build-native.mjs --out "$PWD/target/lintrs-native"
      - name: Build the distribution
        run: npm run dist
      - name: Smoke the distribution
        run: |
          dir=$(node -p 'const fs=require("fs");JSON.parse(fs.readFileSync("dist/"+fs.readdirSync("dist").find(f=>f.endsWith(".json")),"utf8")).directory')
          mv "$dir" "$RUNNER_TEMP/lintrs-moved"
          sdk=$(node -p 'const fs=require("fs");JSON.parse(fs.readFileSync("dist/"+fs.readdirSync("dist").find(f=>f.endsWith(".json")),"utf8")).sdkTarball')
          node scripts/smoke-dist.mjs "$RUNNER_TEMP/lintrs-moved" "$sdk"
      - name: Pack the npm packages
        run: node scripts/pack-npm.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lintrs-${{ matrix.target }}
          path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: lintrs-npm-${{ matrix.target }}
          path: dist/npm/*.tgz

  release:
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lintrs-*
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # Re-running for an existing tag replaces the assets instead of failing.
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.tar.gz --clobber
          else
            gh release create "$tag" --title "lintrs $tag" --generate-notes ./*.tar.gz
          fi

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: lintrs-npm-*
          merge-multiple: true
          path: npm
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish"
            exit 0
          fi
          # Versions already on npm are skipped, so a partly published tag can
          # re-run. A fresh package can stay unreadable for a while after
          # publishing, so npm's own "already published" refusal counts too.
          publish() {
            spec=$(tar -xOzf "$1" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); p.name + "@" + p.version')
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published; skipping"
              return
            fi
            if npm publish "$1" --provenance --access public >publish.log 2>&1; then
              cat publish.log
              return
            fi
            cat publish.log
            grep -q "cannot publish over the previously published" publish.log || return 1
            echo "$spec is already published; skipping"
          }
          # Platform packages first: @lintrs/cli depends on them. The ./ prefix
          # matters, since npm reads a bare "npm/<file>" as a GitHub user/repo.
          # @lintrs/cli packs as lintrs-cli-<version>.tgz.
          for tgz in ./npm/lintrs-darwin-arm64-*.tgz ./npm/lintrs-linux-x64-gnu-*.tgz ./npm/lintrs-cli-*.tgz; do
            publish "$tgz"
          done
