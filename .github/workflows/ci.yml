name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: npm run format:check
      - run: cargo fetch --locked
      - run: cargo test --locked -p lintrs
      - name: Build the native layout
        run: |
          node scripts/build-native.mjs --out "$PWD/target/lintrs-native"
          test -f target/lintrs-native/bin/lintrs
          test -f target/lintrs-native/lib/liblintrs.node
          test -f target/lintrs-native/lib/liblintrs.${{ runner.os == 'macOS' && 'dylib' || 'so' }}
      - name: Lint the typed-native build
        run: cargo clippy --locked --all-targets --features typed-native -p lintrs -- -D warnings
      - name: Run the tsrs_api extension tests
        run: cargo test --locked -p tsrs_api lintrs_
      - name: Host tests (eager typed native)
        env:
          LINTRS_TYPED_NATIVE: "1"
          LINTRS_IN_PROCESS_BINDING: ${{ github.workspace }}/target/lintrs-native/lib/liblintrs.node
          LINTRS_BINARY: ${{ github.workspace }}/target/lintrs-native/bin/lintrs
          LINTRS_TEST_BINARY: ${{ github.workspace }}/target/lintrs-native/bin/lintrs
          LINTRS_COMPACT_DECLARATIONS: "1"
          LINTRS_FUSED_SYMBOLS: "1"
          LINTRS_TRUE_BULK: "1"
          LINTRS_CONTEXTUAL_BATCH: "1"
        run: npm run test:host
      - name: Host tests (lazy objects)
        env:
          LINTRS_TYPED_NATIVE: "1"
          LINTRS_IN_PROCESS_BINDING: ${{ github.workspace }}/target/lintrs-native/lib/liblintrs.node
          LINTRS_BINARY: ${{ github.workspace }}/target/lintrs-native/bin/lintrs
          LINTRS_TEST_BINARY: ${{ github.workspace }}/target/lintrs-native/bin/lintrs
          LINTRS_LAZY_OBJECTS: "1"
          LINTRS_LAZY_PREFETCH: "1"
          LINTRS_ADAPTIVE_FACTS: "1"
        run: npm run test:host
      - name: Build and smoke the distribution
        run: |
          npm run dist
          dir=$(node -p 'const fs=require("fs");JSON.parse(fs.readFileSync("dist/"+fs.readdirSync("dist").find(f=>f.endsWith(".json")),"utf8")).directory')
          mv "$dir" "$RUNNER_TEMP/lintrs-moved"
          sdk=$(node -p 'const fs=require("fs");JSON.parse(fs.readFileSync("dist/"+fs.readdirSync("dist").find(f=>f.endsWith(".json")),"utf8")).sdkTarball')
          node scripts/smoke-dist.mjs "$RUNNER_TEMP/lintrs-moved" "$sdk"
